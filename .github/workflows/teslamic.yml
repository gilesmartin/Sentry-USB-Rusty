name: TeslaMic package

on:
  push:
    paths:
      - "teslamic/**"
      - "run/rsync_archive/**"
      - "pi-gen-sources/00-sentryusb-tweaks/files/sentryusb-pick-binary"
      - "test/teslamic-package.test.py"
      - ".github/workflows/teslamic.yml"
  pull_request:
    paths:
      - "teslamic/**"
      - "run/rsync_archive/**"
      - "pi-gen-sources/00-sentryusb-tweaks/files/sentryusb-pick-binary"
      - "test/teslamic-package.test.py"
      - ".github/workflows/teslamic.yml"

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Package contract and rollback tests
        run: python3 test/teslamic-package.test.py
      - name: Descriptor tests
        run: python3 teslamic/kernel/tests/test_descriptors.py
      - name: Shell syntax and lint
        run: |
          bash -n teslamic/install.sh teslamic/uninstall.sh teslamic/verify.sh
          bash -n teslamic/scripts/teslamic-compose teslamic/scripts/teslamic-bluealsa-bridge teslamic/scripts/teslamic-devices teslamic/scripts/teslamic-ensure-integration teslamic/scripts/sentryusb-readonly-root
          bash -n run/rsync_archive/archive-clips.sh run/rsync_archive/copy-music.sh run/rsync_archive/archive-is-reachable.sh pi-gen-sources/00-sentryusb-tweaks/files/sentryusb-pick-binary
          shellcheck teslamic/install.sh teslamic/uninstall.sh teslamic/verify.sh
          shellcheck teslamic/scripts/teslamic-compose teslamic/scripts/teslamic-bluealsa-bridge teslamic/scripts/teslamic-devices teslamic/scripts/teslamic-ensure-integration teslamic/scripts/sentryusb-readonly-root
          shellcheck run/rsync_archive/archive-clips.sh run/rsync_archive/copy-music.sh run/rsync_archive/archive-is-reachable.sh pi-gen-sources/00-sentryusb-tweaks/files/sentryusb-pick-binary
      - name: Pairing helper syntax
        run: python3 -m py_compile teslamic/scripts/teslamic-pair

  kernel-build-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain target build requirement
        run: |
          echo "The module is built and validated on the target Pi against /lib/modules/$(uname -r)/build."
          echo "Generic GitHub runner headers are not accepted as proof of Raspberry Pi kernel compatibility."
